modLoader="javafml"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="ascension"
type="required"
versionRange="[0.2.0-Alpha-Release,)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="zenithlib"
type="required"
versionRange="[0.1,)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="easy_gui"
type="required"
versionRange="[1,)"
ordering="AFTER"
side="CLIENT"
